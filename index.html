<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi primera web</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { padding: 24px; }
    h1 { color: #38bdf8; }
    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: #38bdf8;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>¡Mi web funciona! 🚀</h1>
    <p>Bienvenido a Salim Capital.</p>
    <button onclick="this.textContent = '¡Todo funciona! ✅'">
      Haz clic para probar
    </button>
  </main>
</body>
</html>
